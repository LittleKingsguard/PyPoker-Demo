# PyPoker-Demo — packaging, owned by the `harness` module (`docs/L1/module-map.md` §5, ASM-11).
#
# Six packages live under `src/` and are imported by their bare names (`engine`, `features`,
# `agents`, `evaluation`, `training`, `harness`), so `src/` is the package root and the
# batteries are declared under `tests/` (`docs/L1/battery.md` §2, `strata/platform.md`).
#
# The dependencies are `strata/platform.md`'s measured set.  `pokerkit` and `numpy` are the
# runtime floor (the engine's game and the R1 backend); `torch` is the backend from R2 on and
# the venv carries `2.13.0+rocm7.1`, which a public `==2.13.0` pin matches (PEP 440 ignores a
# candidate's local label when the pin states none).  Nothing here is added to make a battery
# collectable: the L1 battery runs on `unittest` and imports no third-party package.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pypoker-demo"
version = "0.1.0"
description = "A technique ladder for poker-playing reinforcement learning, on one fixed heads-up game"
requires-python = ">=3.12"
dependencies = [
    "pokerkit==0.7.7",
    "numpy==2.5.4",
]

[project.optional-dependencies]
# the torch backend (`agents`'s second backend, R2–R6)
torch = ["torch==2.13.0"]
# the per-rung notebooks of D-5
notebooks = ["matplotlib"]
# the batteries and the notebook environment
dev = ["pytest==9.2.0", "jupyterlab"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
